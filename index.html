<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- 이 페이지는 GitHub API와 Google 할 일(로그인 도구·Tasks API·로그아웃) 말고는 어디에도 연결할 수 없다 (그 밖의 외부 스크립트·이미지·전송 차단) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://api.github.com https://tasks.googleapis.com https://oauth2.googleapis.com/revoke; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Hub">
  <title>My Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 연결 / 잠금 화면 -->
  <main id="lock" class="lock" hidden>
    <div id="lock-card" class="lock-card"></div>
  </main>

  <!-- 본 화면 -->
  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/tasks">My Hub</a>
      <h1 id="top-title" class="top-title"></h1>
      <nav id="nav" class="nav"></nav>
      <div class="top-actions">
        <button id="sync" class="sync ok" type="button">✓ 저장됨</button>
        <button id="settings-btn" class="icon-btn" type="button" title="설정" aria-label="설정">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button id="lock-now" class="icon-btn" type="button" title="잠금" aria-label="잠금">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </header>
    <main id="view" class="view"></main>
    <!-- 휴대폰(폭 600px 미만)에서만 보이는 아래 메뉴 -->
    <nav id="tabbar" class="tabbar" aria-label="메뉴"></nav>
  </div>

  <dialog id="modal"><form id="modal-form" method="dialog"></form></dialog>

  <dialog id="viewer" class="viewer">
    <div class="viewer-head">
      <div><h2 id="viewer-title"></h2><p id="viewer-meta" class="muted small"></p></div>
    </div>
    <div id="viewer-body" class="viewer-body"></div>
    <div id="viewer-actions" class="modal-actions"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <input id="file-input" type="file" hidden>

  <script type="module" src="js/boot.js"></script>
</body>
</html>
